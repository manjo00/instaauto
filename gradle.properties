# Gradle / Android build settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Non-transitive R classes (smaller, faster)
android.nonTransitiveRClass=true

# Required: project lives under a non-ASCII path (Arabic "Desktop" parent dir).
# AGP blocks non-ASCII paths by default; verified the full build (AAPT2, native
# libs, dex) succeeds here with this override, so we keep the project in place.
android.overridePathCheck=true
